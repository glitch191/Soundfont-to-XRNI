name: Test and build

# Tests run on every push / pull request. Pushing a tag such as "v1.0.0" (or publishing a
# release from the GitHub website with a new "v1.0.0" tag) also builds the Windows .exe and
# attaches it to that release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the executable
        run: python build.py

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soundfont-to-XRNI-windows-x64
          path: dist/*.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
